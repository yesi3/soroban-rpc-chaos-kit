name: Bug report
description: Report reproducible incorrect behavior
title: "fix: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never include RPC credentials, private keys, signed production transactions, or sensitive XDR.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.1.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Node.js version
      options: ["20", "22", "Other"]
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Use synthetic, redacted data and deterministic seeds.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted output
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed credentials, secrets, and sensitive transaction payloads.
          required: true
        - label: I searched existing issues for a duplicate.
          required: true
